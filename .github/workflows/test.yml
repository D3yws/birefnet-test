name: BiRefNet Test

on:
  workflow_dispatch:

jobs:
  process:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Test auth
        env:
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          GOOGLE_REFRESH_TOKEN: ${{ secrets.GOOGLE_REFRESH_TOKEN }}
        run: |
          python -c "
          import os
          cid = os.environ['GOOGLE_CLIENT_ID']
          cs = os.environ['GOOGLE_CLIENT_SECRET']
          rt = os.environ['GOOGLE_REFRESH_TOKEN']
          print('CLIENT_ID末尾:', cid[-20:])
          print('CLIENT_SECRET先頭:', cs[:6])
          print('REFRESH_TOKEN先頭:', rt[:10])
          print('REFRESH_TOKEN末尾:', rt[-10:])
          "

      - name: Run BiRefNet
        env:
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          GOOGLE_REFRESH_TOKEN: ${{ secrets.GOOGLE_REFRESH_TOKEN }}
          DRIVE_WHITE_SOURCE_ID: ${{ secrets.DRIVE_WHITE_SOURCE_ID }}
        run: |
          python -u process.py
